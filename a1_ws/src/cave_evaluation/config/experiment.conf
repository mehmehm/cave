# Settings for run_experiments.sh.
# REPO_ROOT is set by the runner: the repo folder (e.g. ~/cave/cave).

# Opens the cave world in Gazebo. The runner then spawns the A1 itself
# (roslaunch cave_sensor_robot spawn_cave_a1.launch).
WORLD_CMD="roslaunch gazebo_cave_world cave_world.launch"

# LIO-SAM with the A1 settings (written by setup_cave.sh).
LIO_SAM_LAUNCH="$(rospack find cave_evaluation 2>/dev/null)/launch/lio_sam_a1.launch"

# The ONLY workspaces used, in order (both inside the repo).
ROS_SETUP=/opt/ros/noetic/setup.bash
WORKSPACES=("$REPO_ROOT/catkin_ws/devel/setup.bash" "$REPO_ROOT/a1_ws/devel/setup.bash")

# Run settings (can also be given on the command line, see --help).
CONFIGS="LIDAR_ONLY RGB_LIDAR THERMAL_LIDAR ADAPTIVE"
REPEATS=1
CONDITION=MIXED
MAX_RUN_SECONDS=2400          # 40 min of simulation time per run
MAX_LINEAR_SPEED=0.35
THRESHOLD_MODE=fixed          # or auto
CMD_VEL_TOPIC=/a1/cmd_vel     # CHAMP's velocity input (your terminal 13)
RECORD_BAG=true               # rosbag per run (your terminal 12)
RESULTS_DIR="$REPO_ROOT/a1_ws/experiments/results"
BAG_DIR="$REPO_ROOT/a1_ws/experiments/bags"
LOG_DIR="$REPO_ROOT/a1_ws/experiments/logs"
WALL_TIMEOUT_SECONDS=10800    # safety stop if the sim runs very slowly (3 h)
